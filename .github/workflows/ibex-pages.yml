name: Publicar informe IBEX

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['IBEX 35 diario']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ibex-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'brexit16code/TradingAgents' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperar los informes generados
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ibex-reports
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publicar solo los informes sin datos personales
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: latest
      - name: Desplegar el informe web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
